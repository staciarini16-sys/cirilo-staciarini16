<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Card Gamer Dinâmico</title>

<style>
.voltar-projeto{position:fixed;top:14px;left:14px;z-index:9999;text-decoration:none;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-family:Arial,sans-serif;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.voltar-projeto:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<a class="voltar-projeto" href="../../atividades.html">← Voltar ao projeto</a>
  <div class="card">
    <div class="card-topo">
      <div class="avatar">🕹️</div>
      <div class="info-jogador">
        <h1 class="nome">NeoStriker</h1>
        <span class="rank">◆ Rank Mestre</span>
      </div>
    </div>

    <div class="card-stats">
      <div class="stat">
        <span class="stat-label">Nível</span>
        <span class="stat-valor">58</span>
      </div>
      <div class="stat">
        <span class="stat-label">Vitórias</span>
        <span class="stat-valor">421</span>
      </div>
      <div class="stat">
        <span class="stat-label">K/D Ratio</span>
        <span class="stat-valor">4.2</span>
      </div>
    </div>

    <div class="barra-xp">
      <span class="xp-label">XP: 8.200 / 10.000</span>
      <div class="barra-fundo">
        <div class="barra-progresso"></div>
      </div>
    </div>
  </div>
</body>
</html>
