<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Galeria de Animações CSS</title>

<style>
.voltar-projeto{position:fixed;top:14px;left:14px;z-index:9999;text-decoration:none;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-family:Arial,sans-serif;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.voltar-projeto:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<a class="voltar-projeto" href="../../atividades.html">← Voltar ao projeto</a>
  <header class="cabecalho">
    <h1>⚡ Galeria de Animações CSS</h1>
  </header>

  <section class="vitrine">
    <h2>1. Botão com Hover</h2>
    <button class="btn-hover">Interagir ⚡</button>
  </section>

  <section class="vitrine">
    <h2>2. Badge Pulsante</h2>
    <div class="badge-wrap">
      <span class="icone">💬</span>
      <span class="badge">5</span>
    </div>
  </section>

  <section class="vitrine">
    <h2>3. Spinner de Carregamento</h2>
    <div class="spinner"></div>
  </section>

  <section class="vitrine">
    <h2>4. Card com Entrada Suave</h2>
    <div class="card-fade">
      <p>Este elemento aparece com fade-in e movimento.</p>
    </div>
  </section>

  <section class="vitrine">
    <h2>5. Barra de Progresso</h2>
    <div class="barra-container">
      <div class="barra-fill"></div>
    </div>
  </section>
</body>
</html>
